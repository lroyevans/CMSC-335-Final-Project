<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Photo Viewer</title>
        <link href="style.css" rel="stylesheet" type="text/css">
        <script src="code.js" defer></script>
    </head>
    <body>
        <h1>Photo Viewer</h1>
        <img src="InitialImage.jpg" alt="current image" id="display_image" onclick="updateImage(Actions.INC)">

        <form>
            <fieldset>
                <legend><strong>Status</strong></legend>
                <label>Photo Being Displayed: <input disabled type="text" id="photoURL" value="InitialImage.jpg"></label>
                <div id="status_display">Photo Viewer System</div>
            </fieldset>
            <fieldset>
                <legend><strong>Loading Images(Local Folder)</strong></legend>
                <label>Photos' Folder: <input type="text" value="umcp/" id="folder"></label>
                <label>Commen Name: <input type="text" value="college" id="name"></label>
                <br>
                <label>Start Photo Number: <input type="number" value="2" id="start"></label>
                <label>End Photo Number: <input type="number" value="4" id="end"></label>
                <br>
                <button type="button" onclick="loadPhotos()">Load Photos</button>
            </fieldset>
            <fieldset>
                <legend><strong>Loading Images(JSON File)</strong></legend>
                <label>URL: <input type="url" value="https://egonzal5.github.io/cmsc335/images/imagesSet1.json" id="json"></label>
                <button type="button" onclick="loadJSON()">Load JSON</button>
            </fieldset>
            <fieldset>
                <legend><strong>Iterating</strong></legend>
                <!-- could all be one function  -->
                <button type="button" onclick="updateImage(Actions.DEC)">Previous Photo</button>
                <button type="button" onclick="updateImage(Actions.INC)">Next Photo</button>
                <button type="button" onclick="updateImage(Actions.START)">First Photo</button>
                <button type="button" onclick="updateImage(Actions.END)">Last Photo</button>
            </fieldset>
            <fieldset>
                <legend><strong>SlideShows</strong></legend>
                <button type="button" onclick="startAnimation()">SlideShow</button>
                <button type="button" onclick="randAnimation()">RamdomSlideShow</button>
                <button type="button" onclick="stopAnimation()">StopSlideShow</button>
            </fieldset>
            <hr>
            <button type="reset">Rest Form values</button>
         </form>
    </body>
</html>
