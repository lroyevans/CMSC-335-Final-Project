<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>NaN example</title>
</head>

<body>
    <script>
        "use strict";
       
        function addValue(data, elem) {
            return data.push(elem), data;
        }

        const x = (4, 5);
        document.writeln(x);
        const data= [];
        document.writeln(`<hr>${addValue(data, 10)}`);
    </script>
</body>

</html>
