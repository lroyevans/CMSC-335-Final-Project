<!DOCTYPE html>
<html>

<head lang="en">
    <meta charset="utf-8">
    <title>Arrow Functions and "this"</title>
</head>

<body>
    <h1>Event Loop (Open the Console)</h1>
        
    <script>
        let count = 0;
        function displayMessage() {
            console.log(`Count: ${++count}`);
        }

        setInterval(displayMessage, 1000);
        let i = 1, maximum = 500000;
        while (i <= maximum) {
            console.log(`i: ${i}`);
            i++;
        }
        
    </script>
</body>

</html>
