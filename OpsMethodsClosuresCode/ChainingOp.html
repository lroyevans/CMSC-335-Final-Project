<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>JS Example</title>
  </head>
  <body>
    <script>
      "use strict";
      /* Defining two students with different pieces of information */
      /* Student #1 */
      const mary = {
        name: "Mary",
        address: {
          city: "College Park",
          state: "Maryland",
          coordinates: {
            longitude: 340,
            latitude: 500,
          },
        },
      };

      /* Student #2 */
      const peter = { name: "Peter" };

      function printInfoWrong(student) {
        let answer = `Printing info for ${student.name} `;

        answer += ` ${student.address.city} ${student.address.state}<br>`;
        document.writeln(`printInfoWrong - ${answer}<br>`);
      }

      function printInfoCorrect(student) {
        let answer = `Printing info for ${student?.name} `;

        answer += `Longitude: ${student.address?.coordinates?.longitude}, :Latitude: ${student.address?.coordinates?.latitude}<br>`;
        document.writeln(`printInfoCorrect- ${answer}<br>`);
      }

      printInfoWrong(mary);
      // printInfoWrong(peter); /* Uncomment and check console to see the problem */

      // printInfoCorrect(mary);
      // printInfoCorrect(peter);
    </script>
  </body>
</html>
