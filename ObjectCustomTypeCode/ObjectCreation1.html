<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>JS Object Creation Example</title>
  </head>

  <body>
   <h1>Check Console for Output</h1>
    <script>
      "use strict";

      /***** object1 *****/
      const object1 = new Object();
      const object2 = new Object();
      const object3 = {};
      let message;

      if (object1.__proto__ === object2.__proto__) {
        message = "same (1 and 2)";
      } else {
        message = "different (1 and 2)";
      }
      console.log(message);

      if (object1.__proto__ === object3.__proto__) {
        message = "same (1 and 3)";
      } else {
        message = "different (1 and 3)";
      }
      console.log(message);

      console.log(`Object.prototype.__proto__: ${Object.prototype.__proto__}`);
      console.log(`\n\n\n##### Object.prototype: #####`);
      console.table(Object.prototype);
    </script>
  </body>
