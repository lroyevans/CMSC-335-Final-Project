<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>JS Example</title>
</head>

<body>
    <script>
        "use strict";

        /* Constructor function */
        function Student(name, credits, courses) {
            this.name = name;
            this.credits = credits;
            this.courses = [...courses];
        }

        /* Prototype for all objects created by the Student constructor function */
        Student.prototype = { /* Throwing away the prototype object we had */

             /* Student is the constructor function that creates the object's prototype */
            constructor: Student,
            college: "UMCP",
            info: function () {
                document.writeln(`Name: ${this.name}, Credits: ${this.credits}
                                  Courses: ${this.courses}, College: ${this.college} <br>`);
            }
        };

        
        const kelly = new Student("Kelly", 15, [414, 420]);
        document.writeln("**** Kelly<br>");
        kelly.info();

        document.writeln("<br>**** Peter<br>");
        const peter = new Student("Peter", 12, [314, 320]);
        peter.info();

        /* Even if instances for an object has been created, adding a
           property/method to the prototype will make it immediately
           available.
        */
        Student.prototype.collegeLocation = "College Park";

        document.writeln("<br>Accessing property added to prototype from both students<br>");
        document.writeln(`kelly.collegeLocation: ${kelly.collegeLocation}<br>`);
        document.writeln(`peter.collegeLocation: ${peter.collegeLocation}<br>`);

        /* The following will add a property to kelly but will not change Student.prototype.collegeLocation */
        kelly.collegeLocation = "Far From Here State"; /* Changing collegeLocation via instance */
        document.writeln(`kelly.collegeLocation (after assignment to kelly.collegeLocation): ${kelly.collegeLocation}<br>`);
        document.writeln(`peter.collegeLocation (after assignment to peter.collegeLocation): ${peter.collegeLocation}<br>`);

        Student.prototype.collegeLocation = "Winter State University";
        document.writeln(`After changing Student.prototype.collegeLocation<br>`)
        document.writeln(`kelly.collegeLocation: ${kelly.collegeLocation}<br>`);
        document.writeln(`peter.collegeLocation: ${peter.collegeLocation}<br>`);

    </script>
</body>

</html>
