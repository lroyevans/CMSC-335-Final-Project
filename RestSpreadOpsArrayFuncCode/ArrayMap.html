<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>JS Array map method Example</title>
</head>

<body>
    <script>
        "use strict";

        document.writeln("***** <strong>Example #1</strong> Using map function to double values *****<br>");
        const numbers = [2, 30, 44, 5];
        const doubles = numbers.map(num => num * 2);
        document.writeln(`Original array: ${numbers}<br>`);

        /* Using join() to change delimiter */
        document.writeln(`New array (doubled): ${doubles.join('-')} <br><br>`);
    </script>
</body></html>
