<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>JS Example</title>
  </head>
  <body>
    <script>
      "use strict";
      const employees = [
        {
          name: "John",
          salary: 10000,
        },
        {
          name: "Kelly",
          salary: 50000,
        },
        {
          name: "Sarah",
          salary: 2000,
        },
      ];

      /* {} and return are unnecessary */
      const totalSalary = employees.reduce((result, elem) => {
        return result + elem.salary;
      }, 0);
      document.writeln(`totalSalary: ${totalSalary}<br>`);

      const avgSalary = employees.reduce((result, elem) => result + elem.salary / employees.length, 0);
      document.writeln(`avgSalary: ${avgSalary}<br>`);

      /* {} and return are unnecessary */
      const maxSalary = employees.reduce((result, elem) => {
        return result > elem.salary ? result : elem.salary;
      }, 0);
      document.writeln(`maxSalary: ${maxSalary}<br>`);

      const minSalary = employees.reduce((result, elem) => result < elem.salary ? result : elem.salary, employees[0].salary); // Can we use 0 as the initial value?
      document.writeln(`minSalary: ${minSalary}<br>`);
    </script>
  </body>
</html>
