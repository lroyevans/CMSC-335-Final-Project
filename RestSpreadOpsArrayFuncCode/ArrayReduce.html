<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>JS Example</title>
</head>
<body>
    <script>
      "use strict";
     let initialValue = 0, data = [2, 4, 6];

     document.writeln("<br>========= Case 1 (Sum) =========<br>");
     /* Using unnecessary { } and return */
     const sum = data.reduce((currentResult, elem) => {
        return currentResult + elem;
     }, initialValue);
     document.writeln(`Sum: ${sum}`);

     initialValue = 1;
     document.writeln("<br>========= Case 2 (Product) =========<br>");
     const product1 = data.reduce((currentResult, elem) => currentResult * elem, initialValue);
     document.writeln(`Product: ${product1}`);

     document.writeln("<br>========= Case 3 (No initialValue (shows which values are processed))) =========<br>");
     data.reduce((result, elem) => document.writeln(`${elem}`));
     
     document.writeln("<br>========= Case 4 (Product (no initialValue)) =========<br>");
     const product2 = data.reduce((currentResult, elem) => currentResult * elem);
     document.writeln(`Product: ${product2}`);
   
     initialValue = 0;
     document.writeln("<br>========= Case 5 (with initialValue)=========<br>");
     data.reduce((currentResult, elem, index, array) => {
        document.writeln(`result: ${currentResult}<br>`);
        document.writeln(`elem: ${elem}<br>`);
        document.writeln(`index: ${index}<br>`);
        document.writeln(`array: ${array}<br>`);
        document.writeln("*** next ***<br>");
        /* Notice we are not returning value; problem */
     }, initialValue);

     document.writeln("<br>========= Case 6 (no initialValue)=========<br>");
     data.reduce((currentResult, elem, index, array) => {
        document.writeln(`result: ${currentResult}<br>`);
        document.writeln(`elem: ${elem}<br>`);
        document.writeln(`index: ${index}<br>`);
        document.writeln(`array: ${array}<br>`);
        document.writeln("*** next ***<br>");
     });

     document.writeln("<br>========= Case 7 (with initialValue, returning 20)=========<br>");
     data.reduce((currentResult, elem, index, array) => {
        document.writeln(`result: ${currentResult}<br>`);
        document.writeln(`elem: ${elem}<br>`);
        document.writeln(`index: ${index}<br>`);
        document.writeln(`array: ${array}<br>`);
        document.writeln("*** next ***<br>");
        return 20;
     }, initialValue);
     document.writeln("<br><br>")

     /* This space available for rent; if you read it during lecture,
        you are paying attention :) */
    </script>
</body>
</html>
