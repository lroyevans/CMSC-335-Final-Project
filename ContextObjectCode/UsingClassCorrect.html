<!DOCTYPE html>
<html lang="en">
   <head>
      <title>Example</title>
      <meta charset="utf-8">
   </head>

   <body>
      <h2>See Console for Results</h2>
      <input type="button" id="increaseSalary" value="increaseSalary">
      <input type="button" id="displaySalary" value="displaySalary">

      <script>
         "use strict";
         
         class Salary {
            #salary = 0;

            increaseSalary = () => {  // using arrow function
               console.log("\n****** increaseSalary function ");
               console.log(`In increaseSalary(), value of "this" is:`);
               console.log(this);
               this.#salary += 1000;
               console.log(`In increaseSalary(), value of salary is: ${this.#salary}`);
            };

            displaySalary = () => { // using arrow function
               console.log("\n****** displaySalary function");
               console.log(`In displaySalary(), value of "this" is:`);
               console.log(this);
               console.log(`In displaySalary(), value of salary is: ${this.#salary}`);
            };
         }

         /* Testing the Salary(). It seems to work. */
         console.log("********************************* Testing Salary *********************************");
         const salaryTest = new Salary();
         salaryTest.increaseSalary();
         salaryTest.displaySalary();
         console.log("********************************* END Testing Salary *********************************");


         /*
            You will see the salary increase as "this" in the Salary object will not be
            changed to be the button.
         */
         const salary = new Salary();
         document.getElementById("increaseSalary").addEventListener("click", salary.increaseSalary);
         document.getElementById("displaySalary").addEventListener("click", salary.displaySalary);
      </script>
   </body>
</html>
