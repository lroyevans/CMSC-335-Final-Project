<!DOCTYPE html>
<html>

<head lang="en">
    <meta charset="utf-8">
    <title>Arrow Functions and "this"</title>
</head>

<body>
    <h2>Check console for results</h2>
    <script>
        "use strict";

        function nonArrow() { console.log(`Point #1: Non-arrow (this.mascot): ${this.mascot}`);
                              console.log('this:'); console.log(this) };
    
        const arrow = () => { console.log(`Point #2: Arrow: this.mascot: ${this.mascot}`); 
                              console.log('this:'); console.log(this) };
        const anonymous = function() {console.log(`Point #3: Anonymous: ${this.mascot}`); 
                                console.log('this:'); console.log(this); }

        const obj1 = new Object();
        obj1.mascot = "Testudo";

        nonArrow.call(obj1);
        arrow.call(obj1);    // Will not associate obj1 with "this"
        anonymous.call(obj1);

        const umd = {
            city: "College Park",
            state: "Maryland",
            getInfo: () => { console.log(`Point #4: City: ${this.city}, State: ${this.state}`); 
                             console.log('this:'); console.log(this); },
            getInfoTwo: function() { console.log(`Point #5: The City: ${this.city}, The State: ${this.state}`) 
                                     console.log('this:'); console.log(this);}
        }

        umd.getInfo();
        umd.getInfoTwo();
    </script>
</body>

</html>
