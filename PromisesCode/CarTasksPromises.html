<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>JS Example</title>
  </head>
  <body>
    <h1>Open Console to See Results</h1>
    <script>
      "use strict";

      function randomTime(message, max) {
        const randomTime = Math.floor(Math.random() * max);
        console.log(`${message} starting time: ${randomTime}`);
        return randomTime;
      }

      class Car {
        #log = "";
        #tag;

        constructor(tag) {
          this.#tag = tag;
        }

        addLogEntry(entry) {
          this.#log += `|${entry}`;
        }

        getLog() {
          return `(Tag:${this.#tag}${this.#log})`;
        }
      }

      /* resolve represents what to do after  
            asynchronous task has been completed.  */
      function washCar(car) {
        let promise;

        promise = new Promise((resolve, reject) =>
          setTimeout(
            () => {
              console.log("Using cloth to wash the car");
              car.addLogEntry("Car has been washed");
              resolve(car); /* Whatever we provide to resolve is the promise's result */
            },
            randomTime("wash", 2000),
          ),
        );

        return promise;
      }

      function dryCar(car) {
        return new Promise((resolve, reject) =>
          setTimeout(
            () => {
              console.log("Using dryer to dry the car");
              car.addLogEntry("Car has been dried");
              resolve(car);
            },
            randomTime("dry", 2000),
          ),
        );
      }

      function polishCar(car) {
        return new Promise((resolve, reject) =>
          setTimeout(
            () => {
              console.log("Using polishing machine to polish the car");
              car.addLogEntry("Polishing completed");
              resolve(car);
            },
            randomTime("polishing", 2000),
          ),
        );
      }

      function deliverCar(car) {
        return new Promise((resolve, reject) =>
          setTimeout(
            () => {
              console.log("Delivering car");
              car.addLogEntry("Delivering completed");
              resolve(car);
            },
            randomTime("delivering", 2000),
          ),
        );
      }

      function task1() {
        const car = new Car("Terp");

        /* We do not need .then() to have the car washed */
        washCar(car);
      }

      function task2() {
        const car = new Car("Terp");

        washCar(car);
        /* The following is incorrect as the car might not have been washed */
        console.log(`${car.getLog()}`); 
      }

      function task3() {
        const car = new Car("Terp");

        /* fixing previous task problem */
        washCar(car).then(washedCar => console.log(`${washedCar.getLog()}`)); 
      }

      function task4() {
        const car = new Car("Terp");

        const washedCarPromise = washCar(car);

        // Value returned by the promise is the argument to resolve()
        // Change in washCar resolve(car) to resolve("hello")
        washedCarPromise.then(washedCar => console.log("Washed Car Promise", washedCarPromise));
      }

      function task5() {
        const car = new Car("Terp");
        const washedCarPromise = washCar(car);
        
        /* then() returns a promise. The value of the promise is the value the method
           provided to then() returns.  If it is not a promise it will be enclosed in 
           a Promise object
        */
        let thenPromise = washedCarPromise.then(washedCar => 20);
        thenPromise.then(value => console.log(`value: ${value}`));
   
        thenPromise = washedCarPromise.then(washedCar => "Goodbye");
        thenPromise.then(value2 => console.log(`value2: ${value2}`));
   
        thenPromise = washedCarPromise.then(washedCar => dryCar(washedCar));
        thenPromise.then(value3 => console.log(`value3:`, value3));
      }

      function task6() {
        const car = new Car("Terp");

        washCar(car)
          .then(washedCar => dryCar(washedCar))
          .then(driedCar => console.log(driedCar.getLog()));
      }

      function task7() {
        const car = new Car("Terp");

        washCar(car)
          .then(washedCar => dryCar(washedCar))
          .then(driedCar => polishCar(driedCar))
          .then(polishedCar => console.log(polishedCar.getLog()));
      }

      function task8() {
        const car = new Car("Terp");

        washCar(car)
          .then(washedCar => dryCar(washedCar))
          .then(driedCar => polishCar(driedCar))
          .then(polishedCar => deliverCar(polishedCar))
          .then(deliveredCar => console.log(deliveredCar.getLog()));
      }

      processChoice();
      function processChoice() {
        const taskNumber = Number(prompt("Enter choice: "));
        console.log(`Task #: ${taskNumber}`);

        const taskFunction = new Function("", `task${taskNumber}()`);
        taskFunction();
      }
      
    </script>
  </body>
</html>
