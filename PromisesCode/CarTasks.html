<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <title>JS Example</title>
   </head>
   <body>
      <h1>Open console to see results</h1>
      <script>
         "use strict";
         
         class Car {
            #log = ""; #tag;
            
            constructor(tag) {
               this.#tag = tag;
            }

            addLogEntry(entry) {
               this.#log += `|${entry}`;
            }
            
            getLog() {
               return `(Tag:${this.#tag}${this.#log})`;
            }
         }

         function randomTime(max) {
            return Math.floor(Math.random() * max);
         }

         function washCar(car) {
            setTimeout(() => {
               console.log("Using cloth to wash the car");
               car.addLogEntry("Car has been washed");
            }, randomTime(2000));
         }

         function dryCar(car) {
            setTimeout(() => { 
               console.log("Using dryer to dry the car");
               car.addLogEntry("Car has been dried");
            }, randomTime(2000));
         }

         function polishCar(car) {
            setTimeout(() => {
               console.log("Using polishing machine to polish the car");
               car.addLogEntry("Polishing completed");
            }, randomTime(2000));
         }
         const car1 = new Car("Toyota");
         const car2 = new Car("FastCar");
         const car3 = new Car("SlowCar");
         /* Order of cleaning cars is not important */
         washCar(car1);
         washCar(car2);
         washCar(car3);
   
         /* Assuming that after 8000 milliseconds cars are ready */
         setTimeout(() => console.log(`${car1.getLog()}, ${car2.getLog()}, ${car3.getLog()}`), 8000);
   
         /* Order for tasks (washing, drying, etc.) is important */
         const car4 = new Car("FinalCar");
         washCar(car4);
         dryCar(car4);
         polishCar(car4);

         /* Assuming that after 10000 milliseconds car is ready */
         setTimeout(() => console.log(`${car4.getLog()}`), 10000);
      </script>
   </body>
</html>
