<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <title>ES6 Class Example</title>
   </head>

   <body>
      <script>
         "use strict";

         class Store {
            #name; /* Private instance variable (# makes it private) */
            #location; /* Private instance variable */
            parkingLotCars; /* Public (does not have a #) instance variable */
            static #instances = 0; /* Static and private */

            /* Constructor */
            constructor(name = "NONAME", location = "NOLOCATION", parkingLotCars = 5) {
               if (!this.#isValidName(name)) { /* Accessing private instance variables/methods via this.# */
                  console.log("Warning, name too short");
               }
               this.#name = name;
               this.#location = location;
               this.parkingLotCars = parkingLotCars; // Not using # as it is a public variable
               Store.#instances++; // Increasing number of instances
            }

            /* Non-static method */
            /* Notice: no use of function keyword (function displayInfo()) */
            displayInfo() {
               document.writeln(`${this.#name} located in ${this.#location}`);
               Store.#yearStoreFounded(); /* Calling private static method */
            }

            /* Java's toString() */
            [Symbol.toPrimitive]() {
               return `Name: ${this.#name}, Location: ${this.#location}, Parking Lot Cars: ${this.parkingLotCars}`;
            }

            /* Static method */
            static getInstances() {
               return Store.#instances;
            }

            /* Non-static private method (notice the #) */
            #isValidName(name) {
               return name.length >= 2;
            }

            /* Static private method (notice the #) */
            static #yearStoreFounded() {
               document.writeln(`<br>Store founded in 2000<br>`);
            }
         }

         const musicPalace = new Store("Music Palace", "Greenbelt");
         musicPalace.displayInfo();
         document.writeln(`${musicPalace}<hr>`);

         const shoeWorld = new Store("Shoe World");
         document.writeln(`${shoeWorld}<hr>`);
        
         const unnamedStore = new Store();
         document.writeln(`${unnamedStore}<hr>`);
         
         document.writeln(`Number of stores: ${Store.getInstances()}`);
      </script>
   </body>
</html>
