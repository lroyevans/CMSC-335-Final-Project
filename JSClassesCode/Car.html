<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Example</title>
</head>

<body>
    <script>
        "use strict";

        class Car {
            static dealership = "Terp Cars"; /* Static public */
            static #instances = 0;  /* Static private */
            
            passengers = ["Driver"]; /* Public */
            
            #tag;                   /* Private */
            #mileage;               /* Private */

            constructor(tag, mileage) {
                this.#tag = tag;
                this.#mileage = mileage;
                Car.#instances++;
            }

            /* Getter */
            /* We can call the method (e.g., getMyMvalue) something 
               other than the name of the instance variable */
            get tag() {  // obj.tag will execute this method
                return this.#tag;
            }

            /* Setter */
            /* We can call the method something other than the name 
               of the instance variable */
            set tag(newTag) { // obj.tag = value will execute this method
                if (newTag == null) {
                    document.writeln(`<strong>Oops, cannot set tag to null</strong><br>`);
                } else {
                    this.#tag = newTag;
                }
            }

            static getInstances() {
                return Car.#instances;
            }
            
            [Symbol.toPrimitive]() {  /* Java's toString() */
                /* Template literal allow us to have the indentation below.
                   If we replace the template literal with " " it will not work */
                return `CarInfo: tag: '${this.#tag}'', 
                        mileage: ${this.#mileage},
                        passengers: ${this.passengers}`;
            }
        }

       
        const car1 = new Car("abc", 22000);
        document.writeln(`car1: ${car1}<br>`);
        document.writeln(`Tag: ${car1.tag}<br>`);
        car1.tag = "newTagABC";
        document.writeln(`After updating tag:${car1}<hr>`);
      
        car1.tag = null; /* Attempting to set tag to null (will trigger error message) */

        const car2 = new Car("core1", 40000);
        document.writeln(`<hr>Dealership: ${Car.dealership}<br>`);
        document.writeln(`Instances: ${Car.getInstances()}<br>`);
    </script>
</body>

</html>
